version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: condomanager_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_MODE=produccion
      - DB_TYPE=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=condomanager
      - DB_USER=condouser
      - DB_PASSWORD=condopassword_secure_2026
      - ALLOWED_ORIGINS=*
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change_this_secret_in_production}
    volumes:
      - ./static/receipts:/app/static/receipts
      - ./static/uploads:/app/static/uploads
      - ./backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  db:
    image: postgres:16-alpine
    container_name: condomanager_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: condomanager
      POSTGRES_USER: condouser
      POSTGRES_PASSWORD: condopassword_secure_2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U condouser -d condomanager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: condomanager_postgres_data
